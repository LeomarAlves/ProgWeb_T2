<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Obras de Museu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastro de Obras de Museu</h1>

    
    <ul id="lista-erros"></ul>

    <form id="form-obra">
        <div>
            <label for="nome">Nome da obra:</label>
            <input type="text" id="nome" maxlength="100" placeholder="Ex: A Noite Estrelada">
        </div>

        <div>
            <label for="autor">Autor:</label>
            <input type="text" id="autor" maxlength="100" placeholder="Ex: Vincent van Gogh">
        </div>

        <div>
            <label for="ano">Ano da obra:</label>
            <input type="text" id="ano" maxlength="4" placeholder="Ex: 1889">
        </div>

        <div>
            <label for="periodo">Período da obra:</label>
            <select id="periodo">
                <option value="">Selecione...</option>
                <option value="d.C">d.C</option>
                <option value="a.C">a.C</option>
            </select>
        </div>

        <div>
            <label for="tipo">Tipo:</label>
            <select id="tipo">
                <option value="">Selecione...</option>
                <option value="quadro">quadro</option>
                <option value="escultura">escultura</option>
                <option value="outro">outro</option>
            </select>
        </div>

        <div>
            <label for="detalhamento">Detalhamento:</label>
            <textarea id="detalhamento" rows="4" maxlength="2000" placeholder="Descrição opcional com até 2000 caracteres..."></textarea>
        </div>

        <button type="button" onclick="salvarObra()">Salvar</button>
    </form>

    <h2>Obras Cadastradas</h2>
    <span>Clique em qualquer linha da tabela para visualizar o detalhamento da obra.</span>

    <table>
        <thead>
            <tr>
                <th>Nome da Obra</th>
                <th>Autor</th>
                <th>Ano</th>
                <th>Período</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-obras">
            <tr onclick="mostrarDetalhamento('Pintura a óleo sobre tela retratando a vista da janela do quarto de Van Gogh no hospício de Saint-Rémy-de-Provence.')">
                <td>A Noite Estrelada</td>
                <td>Vincent van Gogh</td>
                <td>1889</td>
                <td>d.C</td>
                <td>quadro</td>
                <td><button type="button" onclick="excluirLinha(event, this)">Excluir</button></td>
            </tr>
            <tr onclick="mostrarDetalhamento('Escultura em mármore representando o herói bíblico Davi antes da batalha contra Golias.')">
                <td>Estatua de Davi</td>
                <td>Michelangelo Buonarroti</td>
                <td>1504</td>
                <td>d.C</td>
                <td>escultura</td>
                <td><button type="button" onclick="excluirLinha(event, this)">Excluir</button></td>
            </tr>
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
